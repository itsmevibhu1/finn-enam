services:
  - type: web
    name: finn-enam
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    envVars:
      - key: FINN_AI_PROVIDER
        value: gemini
      - key: FINN_DOWNLOAD_WORKERS
        value: "1"
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: FINN_GEMINI_DAILY_REQUEST_LIMIT
        value: "8"
